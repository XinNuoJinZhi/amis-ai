[package]
name = "claw-agent-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ureq = { version = "2.9", features = ["json", "tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
uuid = { version = "1.7", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dotenvy = "0.15"
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
walkdir = "2"
regex = "1"
# system_prompt_built 事件用来算 prompt 的 sha256，方便前端比对版本
sha2 = "0.10"

# claw-code 内部 crate
runtime = { path = "../runtime" }
api = { path = "../api" }
# A.3：Skill 工具的 skill 名 → 路径解析，复用 commands::resolve_skill_path
commands = { path = "../commands" }

# A.5：HOME 隔离需要建临时目录；A.3/A.4 单测也用得到
tempfile = "3"

[dev-dependencies]
