version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amis_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amis_ai_dev}
      POSTGRES_DB: ${POSTGRES_DB:-amis_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amis_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./shared/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - postgres

  sandbox-service:
    build:
      context: ./sandbox
      dockerfile_inline: |
        FROM rust:1.82-slim AS builder
        WORKDIR /app
        COPY . .
        RUN cargo build --release --bin sandbox-service

        FROM debian:bookworm-slim
        RUN apt-get update && apt-get install -y ca-certificates docker.io && rm -rf /var/lib/apt/lists/*
        COPY --from=builder /app/target/release/sandbox-service /usr/local/bin/
        CMD ["/usr/local/bin/sandbox-service"]
    ports:
      - "8091:8091"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/amis-ai:/var/amis-ai
    environment:
      SANDBOX_IMAGE: amis-ai-sandbox:uniapp-node20
      SANDBOX_WORKDIR_ROOT: /var/amis-ai/workdirs
      SANDBOX_PNPM_STORE: /var/amis-ai/pnpm-store
      SANDBOX_PORT_RANGE_START: "20000"
      SANDBOX_PORT_RANGE_END: "21000"

volumes:
  postgres_data:
